<!DOCTYPE html>
<html>
<head>
    <title>Sample Market Data</title>
</head>
<body>
    <h1>Market Listings</h1>
    <table class="market-table">
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Name</th>
                <th>Price</th>
                <th>Change</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="symbol">ABC</td>
                <td class="name">Banque A</td>
                <td class="price">123.45</td>
                <td class="change">+1.23%</td>
                <td class="time">2025-12-09 15:30:00</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
